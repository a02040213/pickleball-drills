<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>課表編輯器</title>
<link rel="stylesheet" href="style.css">
</head><body>
<header>
  <h1>課表編輯器</h1>
  <nav class="tabs">
    <button class="tab-btn active" type="button" data-tab="sessions">單日課表</button>
    <button class="tab-btn" type="button" data-tab="drills">課表大全</button>
  </nav>
</header>

<main>
  <section id="tab-sessions" class="tab-panel">
    <div class="pane list-pane">
      <h2>現有課表</h2>
      <table>
        <thead><tr><th>日期</th><th>訓練名稱</th><th></th><th></th></tr></thead>
        <tbody id="session-list"></tbody>
      </table>
      <button id="new-session-btn" type="button">+ 新增一天</button>
    </div>

    <form id="session-form" class="pane form-pane" hidden>
      <h2 id="session-form-title">新增一天</h2>
      <label>日期 <input type="date" id="f-date" required></label>
      <label>訓練名稱 <input type="text" id="f-label" required placeholder="例：11/20"></label>
      <label>熱身時長 <input type="text" id="f-warmup-duration" placeholder="例：10 分鐘"></label>
      <label>熱身備註 <input type="text" id="f-warmup-note"></label>
      <label>輪替說明 <textarea id="f-rotation-note"></textarea></label>

      <h3>訓練項目</h3>
      <ol id="f-blocks"></ol>
      <button type="button" id="add-block-btn">+ 新增項目</button>

      <div class="form-actions">
        <button type="submit">存檔</button>
        <button type="button" id="delete-session-btn" hidden>刪除整天</button>
        <button type="button" id="cancel-session-btn">取消</button>
      </div>
      <p id="session-form-status" role="status"></p>
    </form>
  </section>

  <section id="tab-drills" class="tab-panel" hidden>
    <div class="pane list-pane">
      <h2>現有訓練項目</h2>
      <div id="drill-list"></div>
      <button id="new-drill-btn" type="button">+ 新增項目</button>
    </div>

    <form id="drill-form" class="pane form-pane" hidden>
      <h2 id="drill-form-title">新增訓練項目</h2>

      <label>分類
        <select id="d-category"></select>
      </label>
      <div id="d-new-category" hidden>
        <label>新分類代碼 <input type="text" id="d-cat-code" placeholder="例：09"></label>
        <label>中文名稱 <input type="text" id="d-cat-title-zh"></label>
        <label>英文名稱 <input type="text" id="d-cat-title-en"></label>
        <label>訓練重點 <input type="text" id="d-cat-focus"></label>
        <button type="button" id="d-cat-create-btn">建立分類</button>
      </div>

      <p id="d-id-label">將配發 id：<b id="d-next-id">-</b></p>
      <label>中文標題 <input type="text" id="d-title-zh"></label>
      <label>英文標題 <input type="text" id="d-title-en"></label>
      <label>簡述（選填，複製文字時優先顯示；沒填就顯示英文標題）
        <textarea id="d-summary"></textarea>
      </label>

      <label>預設輪數（選填，排課表時新增 block 自動帶入；沒填套全域預設 3 輪）
        <input type="number" id="d-default-rotations" min="1">
      </label>
      <label>預設說明分鐘（選填，排課表時新增 block 自動帶入；沒填套全域預設 1 分鐘）
        <input type="number" id="d-default-briefing" min="0">
      </label>

      <h3>步驟（method）</h3>
      <ol id="d-method"></ol>
      <button type="button" id="d-add-method-btn">+ 新增步驟</button>

      <h3>重點（points）</h3>
      <ol id="d-points"></ol>
      <button type="button" id="d-add-point-btn">+ 新增重點</button>

      <div id="d-diagram-section">
        <h3>示意圖</h3>
        <p id="d-diagram-hint"></p>
        <drillplot-editor id="drill-editor" save-label="存檔示意圖"></drillplot-editor>
        <p id="d-diagram-status" role="status"></p>
      </div>

      <div class="form-actions">
        <button type="button" id="d-save-btn" disabled>存檔</button>
        <button type="button" id="d-cancel-btn">取消</button>
      </div>
      <p id="d-status" role="status"></p>
    </form>
  </section>
</main>

<footer id="action-bar">
  <button type="button" id="ab-build-btn">Test build</button>
  <button type="button" id="ab-diff-btn">Diff</button>
  <span id="ab-status" role="status"></span>
  <pre id="ab-build-output" hidden></pre>
  <pre id="ab-diff-output" hidden></pre>
  <div id="ab-commit-area" hidden>
    <label>Commit message <input type="text" id="ab-commit-message"></label>
    <button type="button" id="ab-commit-push-btn">Commit &amp; Push</button>
  </div>
</footer>

<script type="module" src="vendor/drillplot/editor.js"></script>
<script src="session-merge.js"></script>
<script src="date-utils.js"></script>
<script src="app.js"></script>
</body></html>
